<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치과의사 보수교육 일정</title>
<style>
  :root{
    --bg:#ffffff;--panel:#fafafa;--line:#e6e6e6;--line-strong:#d4d4d4;
    --text:#1c1c1c;--muted:#8a8a8a;--muted-2:#6b6b6b;--hover:#f6f6f6;
  }
  *{box-sizing:border-box;}
  html{scrollbar-gutter:stable;overflow-y:scroll;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
    color:var(--text);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px 80px;}

  header{padding:26px 0 10px;}
  header h1{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-0.2px;}
  header .meta{color:var(--muted);font-size:12.5px;}
  header .meta b{color:var(--muted-2);font-weight:600;}

  /* Month swiper + year */
  .swiper-bar{position:sticky;top:0;z-index:20;background:var(--bg);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0 10px;}
  .year-label{text-align:center;font-size:13px;font-weight:600;color:var(--muted-2);
    letter-spacing:.5px;margin-bottom:2px;}
  .swiper{position:relative;display:flex;overflow-x:auto;gap:4px;
    scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);}
  .swiper::-webkit-scrollbar{display:none;}
  .m-item{scroll-snap-align:center;flex:0 0 auto;min-width:64px;text-align:center;
    padding:10px 12px;cursor:pointer;font-size:16px;color:var(--muted);border-radius:10px;
    transition:color .15s,font-size .15s;user-select:none;white-space:nowrap;}
  .m-item.sel{color:var(--text);font-size:22px;font-weight:700;}
  .m-spacer{flex:0 0 46%;}

  /* Advanced search */
  details.advanced{border-bottom:1px solid var(--line);}
  details.advanced summary{list-style:none;cursor:pointer;padding:11px 2px;font-size:12.5px;
    font-weight:600;color:var(--muted-2);display:flex;align-items:center;gap:6px;}
  details.advanced summary::-webkit-details-marker{display:none;}
  details.advanced summary::before{content:"▸";font-size:10px;color:var(--muted);transition:transform .15s;}
  details.advanced[open] summary::before{transform:rotate(90deg);}
  .adv-body{padding:6px 2px 14px;}
  .adv-group{margin-bottom:16px;}
  .adv-group:last-child{margin-bottom:2px;}
  .adv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .adv-label{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-0.2px;}
  .adv-label b{font-weight:500;color:var(--muted);font-size:11.5px;margin-left:5px;}
  .adv-tools{flex:0 0 auto;display:flex;gap:4px;}
  .adv-tools .lnk{font-size:11px;color:var(--muted-2);background:none;border:1px solid var(--line-strong);
    border-radius:5px;padding:3px 8px;cursor:pointer;white-space:nowrap;}
  .adv-tools .lnk:hover{background:var(--hover);color:var(--text);}
  .chips-wrap{display:flex;align-items:flex-start;gap:8px;min-width:0;}
  .chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;}
  .more-btn{flex:0 0 auto;line-height:23px;white-space:nowrap;font-size:11px;color:var(--muted-2);
    background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;}
  .more-btn:hover{color:var(--text);}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#bcbcbc;
    border:1px solid var(--line);border-radius:12px;padding:2px 7px;cursor:pointer;
    user-select:none;background:var(--bg);white-space:nowrap;}
  .chip input{display:none;}
  .chip i{color:#d0d0d0;font-style:normal;font-size:9.5px;}
  .chip.on{background:#f2f2f2;color:var(--muted-2);border-color:var(--line-strong);}
  .chip.on i{color:var(--muted);}
  .count{padding:14px 2px 8px;font-size:12.5px;color:var(--muted);}
  .count b{color:var(--text);font-weight:600;}

  /* Table */
  .table-wrap{overflow-x:auto;border-top:1px solid var(--line-strong);}
  table{width:100%;border-collapse:collapse;min-width:700px;table-layout:fixed;}
  thead th{font-size:12px;font-weight:600;color:var(--muted-2);text-align:center;
    padding:10px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:var(--bg);}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px;}
  tbody tr.item{cursor:pointer;}
  tbody tr.item:hover{background:var(--hover);}
  tr.item.past{color:var(--muted-2);}
  tr.item.past .t-title{color:var(--muted-2);}

  .c-date{white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums;font-size:11.5px;line-height:1.35;}
  .c-time{white-space:nowrap;text-align:center;color:var(--muted-2);font-variant-numeric:tabular-nums;}
  .c-region{white-space:nowrap;}
  .c-title{min-width:240px;}
  .t-title{font-weight:600;letter-spacing:-0.2px;word-break:keep-all;}
  .t-place{font-size:12px;color:var(--muted);margin-top:3px;word-break:keep-all;}
  .c-score{white-space:nowrap;text-align:center;}
  .score-txt{font-weight:600;}
  .req-mark{position:relative;display:inline-block;margin-left:3px;font-size:11px;color:var(--muted);cursor:default;vertical-align:top;}
  .req-mark:hover{color:var(--text);}
  .req-mark .tip{position:absolute;bottom:150%;left:50%;transform:translateX(-50%);
    background:#2b2b2b;color:#fff;font-size:11px;font-weight:400;line-height:1.3;padding:3px 7px;
    border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;z-index:60;}
  .req-mark:hover .tip{opacity:1;}
  .cost-txt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted-2);}

  colgroup .col-date{width:64px;}
  colgroup .col-time{width:92px;}
  colgroup .col-region{width:50px;}
  colgroup .col-score{width:54px;}
  colgroup .col-cost{width:176px;}

  tr.detail td{background:var(--panel);padding:12px 14px;border-bottom:1px solid var(--line);}
  .detail-grid{display:flex;flex-wrap:wrap;gap:6px 28px;font-size:12.5px;color:var(--muted-2);}
  .detail-grid .d{display:flex;gap:7px;}
  .detail-grid .k{color:var(--muted);flex:0 0 auto;}
  .detail-note{margin-top:9px;font-size:12.5px;color:var(--muted-2);white-space:pre-wrap;word-break:break-word;
    line-height:1.6;padding-top:9px;border-top:1px dashed var(--line-strong);}

  .empty{padding:60px 0;text-align:center;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>치과의사 보수교육 일정</h1>
    <div class="meta"><span id="rangeLabel"></span>총 <b id="totalCount">0</b>건 · 갱신 <span id="genAt"></span></div>
  </header>

  <div class="swiper-bar">
    <div class="year-label" id="curYear"></div>
    <div class="swiper" id="swiper"></div>
  </div>

  <details class="advanced" open>
    <summary>상세 검색</summary>
    <div class="adv-body">
      <div class="adv-group">
        <div class="adv-head">
          <span class="adv-label">지역<b id="regionSel"></b></span>
          <span class="adv-tools"><button class="lnk" data-all="region">모두 선택</button><button class="lnk" data-none="region">선택 해제</button></span>
        </div>
        <div class="chips-wrap"><div class="chips" id="regionChips"></div><button class="more-btn" data-more="region" style="display:none">더보기</button></div>
      </div>
      <div class="adv-group">
        <div class="adv-head">
          <span class="adv-label">점수<b id="scoreSel"></b></span>
          <span class="adv-tools"><button class="lnk" data-all="score">모두 선택</button><button class="lnk" data-none="score">선택 해제</button></span>
        </div>
        <div class="chips-wrap"><div class="chips" id="scoreChips"></div><button class="more-btn" data-more="score" style="display:none">더보기</button></div>
      </div>
    </div>
  </details>

  <div class="count">검색 결과 <b id="resultCount">0</b>건 <span style="color:var(--muted)">· 행을 클릭하면 상세정보</span></div>

  <div class="table-wrap">
    <table>
      <colgroup>
        <col class="col-date"><col class="col-time"><col class="col-region">
        <col class="col-title"><col class="col-score"><col class="col-cost">
      </colgroup>
      <thead>
        <tr><th>날짜</th><th>시간</th><th>지역</th><th>제목</th><th>점수</th><th>비용</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="empty" id="empty" style="display:none;">해당 조건의 일정이 없습니다.</div>
</div>

<script src="data.js"></script>
<script>
(function(){
  var DATA=(window.KDA_DATA)||{items:[],years:[],generatedAt:'',count:0};
  var items=DATA.items||[];
  var years=(DATA.years&&DATA.years.length)?DATA.years.slice().sort(function(a,b){return a-b;})
            :Array.from(new Set(items.map(function(x){return x.year;}))).sort(function(a,b){return a-b;});
  var WEEK=['일','월','화','수','목','금','토'];
  var now=new Date();
  var todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

  document.getElementById('rangeLabel').textContent=years.length?(years[0]+'~'+years[years.length-1]+' · '):'';
  document.getElementById('totalCount').textContent=DATA.count||items.length;
  document.getElementById('genAt').textContent=DATA.generatedAt||'';

  // ----- 상태 -----
  var selYear=now.getFullYear(), selMonth=now.getMonth()+1;   // 기본: 오늘 연·월
  if(years.indexOf(selYear)===-1) selYear=years[Math.min(years.length-1,0)]||now.getFullYear();
  var fRegion=new Set(), fScore=new Set();

  // ----- 월 스와이퍼 -----
  var swiper=document.getElementById('swiper'), curYear=document.getElementById('curYear');
  var monthEls={};
  function key(y,m){return (m===''?'all':y+'-'+m);}
  function addSpacer(){var s=document.createElement('div');s.className='m-spacer';swiper.appendChild(s);}
  var swItems=[{y:null,m:'',label:'전체'}];
  years.forEach(function(y){ for(var m=1;m<=12;m++) swItems.push({y:y,m:m,label:m+'월'}); });

  addSpacer();
  swItems.forEach(function(it){
    var el=document.createElement('div');el.className='m-item';el.textContent=it.label;
    el.dataset.y=(it.y==null?'':it.y);el.dataset.m=it.m;
    el.addEventListener('click',function(){ selectItem(it); centerTo(el); });
    swiper.appendChild(el);
    monthEls[key(it.y,it.m)]=el;
  });
  addSpacer();

  function markSel(){
    Object.keys(monthEls).forEach(function(k){monthEls[k].classList.remove('sel');});
    var k=(selMonth===''?'all':key(selYear,selMonth));
    if(monthEls[k]) monthEls[k].classList.add('sel');
    curYear.textContent = (selMonth===''?'전체 기간':selYear+'년');
  }
  function centerTo(el){ swiper.scrollTo({left:el.offsetLeft-(swiper.clientWidth-el.offsetWidth)/2,behavior:'smooth'}); }
  function selectItem(it){ selYear=it.y; selMonth=it.m; markSel(); render(); }

  var scrollTimer=null;
  swiper.addEventListener('scroll',function(){
    if(scrollTimer)clearTimeout(scrollTimer);
    scrollTimer=setTimeout(function(){
      var center=swiper.scrollLeft+swiper.clientWidth/2, best=null, bestD=1e9;
      swItems.forEach(function(it){
        var el=monthEls[key(it.y,it.m)]; var c=el.offsetLeft+el.offsetWidth/2, d=Math.abs(c-center);
        if(d<bestD){bestD=d;best=it;}
      });
      if(best && !(best.y===selYear && best.m===selMonth)) selectItem(best);
    },90);
  });

  // ----- 상세 검색 칩 (기본값: 모두 선택) -----
  var chipRefs={region:[],score:[]};
  function buildChips(container, field, sortFn, labelFn, targetSet){
    var m={}; items.forEach(function(x){var v=String(x[field]);m[v]=(m[v]||0)+1;});
    Object.keys(m).sort(sortFn(m)).forEach(function(v){
      targetSet.add(v);                                  // 기본 모두 선택
      var lab=document.createElement('label');lab.className='chip on';
      lab.innerHTML='<input type="checkbox" value="'+v+'" checked>'+labelFn(v)+' <i>'+m[v]+'</i>';
      var cb=lab.querySelector('input');
      cb.addEventListener('change',function(){
        if(cb.checked){targetSet.add(v);lab.classList.add('on');}
        else{targetSet.delete(v);lab.classList.remove('on');}
        updateSel(field); render();
      });
      chipRefs[field].push({v:v,cb:cb,lab:lab});
      container.appendChild(lab);
    });
  }
  function updateSel(field){
    var set=(field==='region'?fRegion:fScore);
    var el=document.getElementById(field+'Sel');
    if(el) el.textContent=' '+set.size+' / '+chipRefs[field].length;
  }
  buildChips(document.getElementById('regionChips'),'region',
    function(m){return function(a,b){return m[b]-m[a];};}, function(v){return v;}, fRegion);
  buildChips(document.getElementById('scoreChips'),'score',
    function(m){return function(a,b){
      var x=(a==='null'?999:+a), y=(b==='null'?999:+b); return x-y;   // 점수없음(필수교육만)은 맨 뒤
    };},
    function(v){return v==='null'?'점수없음':v+'점';}, fScore);

  function setAll(field, on){
    var set=(field==='region'?fRegion:fScore);
    chipRefs[field].forEach(function(r){
      r.cb.checked=on; r.lab.classList.toggle('on',on);
      if(on)set.add(r.v);else set.delete(r.v);
    });
    updateSel(field); render();
  }
  updateSel('region'); updateSel('score');
  Array.prototype.forEach.call(document.querySelectorAll('[data-all]'),function(b){
    b.addEventListener('click',function(){setAll(b.dataset.all,true);});});
  Array.prototype.forEach.call(document.querySelectorAll('[data-none]'),function(b){
    b.addEventListener('click',function(){setAll(b.dataset.none,false);});});

  // ----- 상세검색: 기본 1줄만, 넘치면 더보기 -----
  function setupMore(field){
    var chips=document.getElementById(field+'Chips');
    var btn=document.querySelector('[data-more="'+field+'"]');
    var collapsed=true;
    function rowH(){return (chips.firstChild&&chips.firstChild.offsetHeight)||24;}
    function apply(){
      var h=rowH();
      if(collapsed){chips.style.maxHeight=h+'px';chips.style.overflow='hidden';}
      else{chips.style.maxHeight='none';chips.style.overflow='visible';}
      var overflowing=chips.scrollHeight>h+2;
      btn.style.display=overflowing?'':'none';
      btn.textContent=collapsed?'더보기':'접기';
    }
    btn.addEventListener('click',function(){collapsed=!collapsed;apply();});
    var rt=null;
    window.addEventListener('resize',function(){if(rt)clearTimeout(rt);rt=setTimeout(apply,120);});
    apply();
  }
  setupMore('region'); setupMore('score');

  // ----- 표 렌더 -----
  var tbody=document.getElementById('tbody'),empty=document.getElementById('empty'),
      resultCount=document.getElementById('resultCount');
  function weekday(d){var p=d.split('-');if(p.length!==3)return'';return WEEK[new Date(+p[0],+p[1]-1,+p[2]).getDay()];}
  function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function dateCell(x){var p=x.date.split('-'),s=p[1]+'.'+p[2]+'('+weekday(x.date)+')';
    if(x.endDate&&x.endDate!==x.date){var e=x.endDate.split('-');s+='<br>~'+e[1]+'.'+e[2]+'('+weekday(x.endDate)+')';}return s;}

  function render(){
    var rows=items.filter(function(x){
      if(selMonth!=='' && !(x.year===selYear && x.month===selMonth)) return false;
      if(!fRegion.has(String(x.region))) return false;   // 기본 모두 선택 → 체크된 지역만
      if(!fScore.has(String(x.score))) return false;
      return true;
    });
    rows.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.start<b.start?-1:1);});
    resultCount.textContent=rows.length;
    tbody.innerHTML=''; empty.style.display=rows.length?'none':'block';

    var frag=document.createDocumentFragment();
    rows.forEach(function(x){
      var past=x.date<todayStr;
      var tr=document.createElement('tr');tr.className='item'+(past?' past':'');
      tr.innerHTML=
        '<td class="c-date">'+dateCell(x)+'</td>'+
        '<td class="c-time">'+esc(x.start)+(x.end?'~'+esc(x.end):'')+'</td>'+
        '<td class="c-region">'+esc(x.region)+'</td>'+
        '<td class="c-title"><div class="t-title">'+esc(x.title)+'</div>'+
          (x.place?'<div class="t-place">'+esc(x.place)+'</div>':'')+'</td>'+
        '<td class="c-score"><span class="score-txt">'+(x.score==null?'-':x.score+'점')+'</span>'+
          (x.reqScore>0?'<span class="req-mark">ⓘ<span class="tip">필수교육점수 '+x.reqScore+'점</span></span>':'')+'</td>'+
        '<td class="c-cost"><span class="cost-txt" title="'+esc(x.cost)+'">'+(x.cost?esc(x.cost):'-')+'</span></td>';

      var det=document.createElement('tr');det.className='detail';det.style.display='none';
      var g=['<div class="d"><span class="k">기관</span><span>'+esc(x.org)+'</span></div>'];
      if(x.lecturer)g.push('<div class="d"><span class="k">강사</span><span>'+esc(x.lecturer)+'</span></div>');
      if(x.capacity)g.push('<div class="d"><span class="k">정원</span><span>'+esc(x.capacity)+'명</span></div>');
      if(x.contact)g.push('<div class="d"><span class="k">문의</span><span>'+esc(x.contact)+'</span></div>');
      if(x.cost)g.push('<div class="d"><span class="k">비용</span><span>'+esc(x.cost)+'</span></div>');
      g.push('<div class="d"><span class="k">공식 상세</span><a href="https://edu.kda.or.kr/user/schedule/scheduleInfo.kda?planno='+esc(x.id)+'" target="_blank" rel="noopener">KDA 페이지 열기</a></div>');
      det.innerHTML='<td colspan="6"><div class="detail-grid">'+g.join('')+'</div>'+
        (x.note?'<div class="detail-note">'+esc(x.note)+'</div>':'')+'</td>';
      tr.addEventListener('click',function(){det.style.display=det.style.display==='none'?'table-row':'none';});
      frag.appendChild(tr);frag.appendChild(det);
    });
    tbody.appendChild(frag);
  }

  // ----- 초기화 -----
  markSel(); render();
  (function(){var el=monthEls[selMonth===''?'all':key(selYear,selMonth)];
    if(el) swiper.scrollLeft=el.offsetLeft-(swiper.clientWidth-el.offsetWidth)/2;})();
})();
</script>
</body>
</html>
